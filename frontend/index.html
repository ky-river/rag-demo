<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RAG 知识库问答</title>
  <style>
    body { max-width: 980px; margin: 32px auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
    textarea { width: 100%; max-width: 680px; }
    button { margin: 6px 4px 6px 0; padding: 6px 12px; cursor: pointer; }
    .panel { margin: 20px 0; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
    .score { font-size: 28px; font-weight: 700; color: #176b87; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { padding: 12px; background: #f5f9fa; border-radius: 6px; }
    .sources { display: grid; gap: 8px; margin-top: 12px; }
    .source { padding: 10px 12px; border: 1px solid #d8e2e6; border-radius: 6px; background: #f8fbfc; }
    .source summary { cursor: pointer; font-weight: 600; }
    .source p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <h1>RAG 知识库问答</h1>

  <div class="panel">
    <h2>智能求职 Agent</h2>
    <textarea id="agentMessage" rows="3" placeholder="例如：我应该如何学习 LangGraph？"></textarea>
    <br>
    <button onclick="runAgent()">让 Agent 处理</button>
    <button onclick="clearAgentSession()">清空会话</button>
    <p id="agentResult"></p>
    <div id="agentSources" class="sources"></div>
  </div>

  <textarea id="question" rows="5" cols="60"
    placeholder="请输入问题"></textarea>
  <br>
  <button onclick="ask()">提问</button>


<input type="file" id="pdfFile" accept=".pdf">
<button onclick="uploadPdf()">上传 PDF</button>
<p id="uploadResult"></p>

  <h2>简历与岗位匹配</h2>
  <p>简历 PDF：</p>
  <input type="file" id="resumeFile" accept=".pdf">
  <p>岗位 JD PDF：</p>
  <input type="file" id="jobFile" accept=".pdf">
  <button onclick="matchResume()">开始匹配</button>
  <p id="matchResult"></p>
  <div id="matchDetails"></div>

  <h2>回答</h2>
  <pre id="answer"></pre>

  <h2>来源</h2>
  <div id="sources"></div>

  <script>
    async function ask() {
      const question = document.getElementById("question").value.trim();

      if (!question) {
        alert("请输入问题");
        return;
      }

      document.getElementById("answer").textContent = "正在回答...";

      const response = await fetch(`${window.getRagApiBaseUrl()}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
      });

      const data = await response.json();

      document.getElementById("answer").textContent = data.answer || data.error;

      renderSources("sources", data.sources);
    }
    </script>
    <script>
async function uploadPdf() {
  const file = document.getElementById("pdfFile").files[0];

  if (!file) {
    alert("请选择 PDF 文件");
    return;
  }

  document.getElementById("uploadResult").textContent = "正在上传并建立索引...";

  const formData = new FormData();
  formData.append("file", file);

  const response = await fetch(`${window.getRagApiBaseUrl()}/upload`, {
    method: "POST",
    body: formData
  });

  const data = await response.json();

  document.getElementById("uploadResult").textContent =
    data.message || data.error || "上传失败";
}

async function matchResume() {
  const resume = document.getElementById("resumeFile").files[0];
  const job = document.getElementById("jobFile").files[0];

  if (!resume || !job) {
    alert("请同时选择简历 PDF 和岗位 JD PDF");
    return;
  }

  document.getElementById("matchResult").textContent = "正在分析匹配度...";

  const formData = new FormData();
  formData.append("resume", resume);
  formData.append("job_description", job);

  try {
    const response = await fetch(`${window.getRagApiBaseUrl()}/match`, {
      method: "POST",
      body: formData
    });
    const data = await response.json();
    if (data.error) {
      document.getElementById("matchResult").textContent = data.error;
      return;
    }
    renderMatch(data.analysis);
  } catch (error) {
    document.getElementById("matchResult").textContent =
      "请求失败，请确认后端正在运行";
  }
}

function renderList(items) {
  return `<ul>${(items || []).map(item => `<li>${item}</li>`).join("")}</ul>`;
}

function escapeHtml(value) {
  const element = document.createElement("div");
  element.textContent = String(value ?? "");
  return element.innerHTML;
}

function renderSources(elementId, sources) {
  const container = document.getElementById(elementId);
  const items = Array.isArray(sources) ? sources : [];
  if (!items.length) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML = items.map((source, index) => {
    const filename = escapeHtml(source.filename || "未知文件");
    const page = Number(source.page);
    const pageLabel = Number.isFinite(page) && page > 0 ? `第 ${page} 页` : "页码未知";
    const content = escapeHtml(source.content || "");
    return `
      <details class="source"${index === 0 ? " open" : ""}>
        <summary>${filename} · ${pageLabel}</summary>
        <p>${content}</p>
      </details>`;
  }).join("");
}

async function runAgent() {
  const message = document.getElementById("agentMessage").value.trim();
  if (!message) {
    alert("请输入任务");
    return;
  }

  const result = document.getElementById("agentResult");
  result.textContent = "Agent 正在判断任务类型...";
  renderSources("agentSources", []);
  const sessionId = getSessionId();

  try {
    const response = await fetch(`${window.getRagApiBaseUrl()}/agent-graph`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId })
    });
    const data = await response.json();
    if (data.session_id) {
      localStorage.setItem("rag_agent_session_id", data.session_id);
    }
    result.textContent = data.answer || data.message || data.error || "处理完成";
    renderSources("agentSources", data.sources);
  } catch (error) {
    result.textContent = "请求失败，请确认后端正在运行";
  }
}

function getSessionId() {
  let sessionId = localStorage.getItem("rag_agent_session_id");
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem("rag_agent_session_id", sessionId);
  }
  return sessionId;
}

async function clearAgentSession() {
  const sessionId = getSessionId();
  await fetch(`${window.getRagApiBaseUrl()}/agent/clear`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId })
  });
  document.getElementById("agentMessage").value = "";
  document.getElementById("agentResult").textContent = "会话已清空";
}

let latestAnalysis = null;
let latestStudyPlan = null;

function renderMatch(analysis) {
  latestAnalysis = analysis;
  latestStudyPlan = null;
  document.getElementById("matchResult").textContent = "匹配分析完成";
  document.getElementById("matchDetails").innerHTML = `
    <div class="panel">
      <div>综合匹配度</div>
      <div class="score">${analysis.match_score ?? "-"}%</div>
      <div class="grid">
        <div class="card"><strong>匹配技能</strong>${renderList(analysis.matched_skills)}</div>
        <div class="card"><strong>技能缺口</strong>${renderList(analysis.skill_gaps)}</div>
        <div class="card"><strong>简历修改建议</strong>${renderList(analysis.resume_suggestions)}</div>
        <div class="card"><strong>预测面试题</strong>${renderList(analysis.interview_questions)}</div>
      </div>
      <button onclick='createStudyPlan(${JSON.stringify(analysis.skill_gaps || [])})'>根据技能缺口生成学习计划</button>
      <button onclick="downloadReport()">下载匹配报告</button>
    </div>`;
}

async function createStudyPlan(gaps) {
  document.getElementById("matchResult").textContent = "正在生成 4 周学习计划...";
  const response = await fetch(`${window.getRagApiBaseUrl()}/study-plan`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ gaps })
  });
  const data = await response.json();
  const plan = data.plan;
  if (data.error || plan.raw_plan) {
    document.getElementById("matchResult").textContent = data.error || plan.raw_plan;
    return;
  }
  latestStudyPlan = plan;
  document.getElementById("matchResult").textContent = plan.goal || "学习计划已生成";
  document.getElementById("matchDetails").insertAdjacentHTML("beforeend", `
    <div class="panel"><h3>4 周学习计划</h3>${(plan.weeks || []).map(week =>
      `<div class="card"><strong>第 ${week.week} 周：${week.focus}</strong>${renderList(week.tasks)}<p>交付物：${week.deliverable}</p></div>`
    ).join("")}</div>`);
}

function downloadReport() {
  if (!latestAnalysis) {
    alert("请先完成一次简历与岗位匹配");
    return;
  }

  const list = (items) => (items || []).map(item => `- ${item}`).join("\n");
  let report = `简历与岗位匹配报告\n`;
  report += `生成日期：${new Date().toLocaleString("zh-CN")}\n\n`;
  report += `综合匹配度：${latestAnalysis.match_score ?? "-"}%\n\n`;
  report += `匹配技能：\n${list(latestAnalysis.matched_skills)}\n\n`;
  report += `技能缺口：\n${list(latestAnalysis.skill_gaps)}\n\n`;
  report += `简历修改建议：\n${list(latestAnalysis.resume_suggestions)}\n\n`;
  report += `预测面试题：\n${list(latestAnalysis.interview_questions)}\n`;

  if (latestStudyPlan) {
    report += `\n学习计划：${latestStudyPlan.goal || ""}\n`;
    for (const week of latestStudyPlan.weeks || []) {
      report += `\n第 ${week.week} 周：${week.focus}\n`;
      report += `${list(week.tasks)}\n`;
      report += `交付物：${week.deliverable || ""}\n`;
    }
  }

  const blob = new Blob(["\uFEFF" + report], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "简历岗位匹配报告.txt";
  link.click();
  URL.revokeObjectURL(url);
}
  </script>

</body>
</html>
